<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mica & Eze Prueba</title>
    <link rel="stylesheet" href="css/reset.css?v=19">
    <link rel="stylesheet" href="css/base.css?v=19">
    <link rel="stylesheet" href="css/main.css?v=19">
    <link rel="stylesheet" href="css/animations-decor.css?v=19">
    <link rel="stylesheet" href="css/contador.css?v=19">
    <link rel="stylesheet" href="css/itinerario.css?v=19">
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Open+Sans:wght@300;400;700&display=swap"
        rel="stylesheet" />
</head>

<body class="body">
    <!-- Seccion 1 - main -->
    <section class="section-main">
        <!-- Imagen -->
        <img src="assets//img/Edit2-Amplia.jpg" alt="Fondo romántico" class="main-img" />
        <div class="main-container">
            <!-- Decoraciones -->
            <!-- Decoraciones SUP -->
            <img src="assets/img/decor-main-sup-1.svg" alt="Decoración" class="decor decor-sup decor-sup-1" />
            <img src="assets/img/decor-main-sup-2.svg" alt="Decoración" class="decor decor-sup decor-sup-2" />
            <!-- Decoraciones INF -->
            <img src="assets/img/decor-main-inf-1.svg" alt="Decoración" class="decor decor-inf decor-inf-1" />
            <img src="assets/img/decor-main-inf-2.svg" alt="Decoración" class="decor decor-inf decor-inf-2" />
            <!-- Contenido -->
            <div class=" main-content">
                <div class="fecha-linea-container">
                    <div class="linea"></div>
                    <h2 class="fecha">07.12.2025</h2>
                    <div class="linea"></div>
                </div>
                <div class="nombres">
                    <span class="nombre nombre-1">Mica</span>
                    <span class="amp">&</span>
                    <span class="nombre nombre-2">Eze</span>
                </div>
                <div class="linea-inf"></div>
                <div class="frase-container">
                    <img src="assets/img/comilla-apertura.svg" alt="Comilla apertura" class="comilla-svg" />
                    <p class="frase">Ni un momento, ni la eternidad <br> Esto va más allá</p>
                    <img src="assets/img/comilla-cierre.svg" alt="Comilla cierre" class="comilla-svg" />
                </div>
                <!-- Animación Lottie Music Btn -->
                <canvas class="music-btn" id="animacion-lottie" width="100" height="100"></canvas>
                <!-- Icono estático -->
                <img class="music-btn music-btn-img" id="icono-estatico" src="assets/img/icono-musica.svg">
                <!-- Audio -->
                <audio id="musica-fondo" src="assets/music/musica.mp3" loop preload="auto"></audio>
            </div>
        </div>
    </section>
    <!-- Sección 2 - Contador -->
    <div class="contador-section">
        <div class="contenedor-ondas">
            <div class="onda-1 onda"></div>
            <div class="onda-2 onda"></div>
            <div class="onda-3 onda"></div>
        </div>
        <div class="circulo-contenedor">
            <div class="circulo-contador">
                <p class="contador-palabra">Falta</p>
                <div class="contador-numeros-container">
                    <div class="casillero-contador">
                        <p class="tiempo-numero">10</p>
                        <p class="tiempo-letra">días</p>
                    </div>
                    <div class="casillero-contador">
                        <p class="tiempo-numero">10</p>
                        <p class="tiempo-letra">hs</p>
                    </div>
                    <div class="casillero-contador">
                        <p class="tiempo-numero">10</p>
                        <p class="tiempo-letra">min</p>
                    </div>
                    <div class="casillero-contador">
                        <p class="tiempo-numero">10</p>
                        <p class="tiempo-letra">seg</p>
                    </div>
                </div>
                <!-- <div class="corazon"></div> -->
                <dotlottie-wc class="corazon"
                    src="https://lottie.host/1113202c-6197-4576-be8a-b5dd80591cbd/xlXjSyH9gE.lottie" speed="1" autoplay
                    loop></dotlottie-wc>
            </div>
            <div class="circulo-contador circulo-contador-shadow"></div>
            <div class="circulo-contador-decor"></div>
            <div class="circulo-contador-decor circulo-contador-decor-shadow"></div>
        </div>
    </div>
    <!-- Sección 3 - itinerario -->
    <section class="section-itinerario">
        <div class="itinerario-bg"></div>
    </section>
    <!-- Scripts -->
    <!-- Music Btn -->
    <script type="module" src="js/music-control.js"></script>
    <!-- Corazon -->
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>
    <script src="js/animations-decor.js?v=19"></script>
    <script src="js/contador.js"></script>
</body>

</html>
